name: Deploy · 智能任务板

# 自动化部署：
#   push 到 test 分支 → 部署到服务器【测试环境】（docker-compose.yml，端口 3000/3001）
#   push 到 main 分支 → 部署到服务器【生产环境】（docker-compose.prod.yml，端口 3100/3101）
#
# 前置条件（仓库 Settings → Secrets and variables → Actions）：
#   SERVER_HOST   服务器 IP，如 124.223.192.177
#   SERVER_USER   SSH 登录用户名
#   SSH_PRIVATE_KEY  登录服务器的私钥（对应服务器 ~/.ssh/authorized_keys 中的公钥）
#   GITEE_TOKEN   推送 Gitee 镜像仓库的 token
#
# Server deployment directories:
#   test: /opt/stb/test/test
#   production: /opt/stb/prod/prod
#
# 注意：backend/.env.prod 与 web/.env.prod 不进 git，需提前手动放到生产目录；
#       测试环境用已提交的 .env.test，无需额外配置。

on:
  push:
    branches: [main, test]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: [backend-check, web-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 解析目标环境
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/prod/prod" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
            echo "web_port=3100" >> "$GITHUB_OUTPUT"
            echo "backend_port=3101" >> "$GITHUB_OUTPUT"
          else
            echo "name=test" >> "$GITHUB_OUTPUT"
            echo "branch=test" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/test/test" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.yml" >> "$GITHUB_OUTPUT"
            echo "web_port=3000" >> "$GITHUB_OUTPUT"
            echo "backend_port=3001" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步代码到 Gitee（供服务器拉取）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.env.outputs.branch }}"
          TARGET_SHA="${{ github.sha }}"
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN is not configured"
            exit 1
          fi
          # Push the exact GitHub commit to the Gitee mirror.
          AUTH_HEADER=$(printf '%s' "mderp:$GITEE_TOKEN" | base64 --wrap=0)
          git -c http.extraHeader="Authorization: Basic $AUTH_HEADER" \
            push "https://gitee.com/mderp/smart-task-board.git" \
            "$TARGET_SHA:refs/heads/$BRANCH"

          MIRROR_SHA=""
          for attempt in $(seq 1 12); do
            if MIRROR_SHA=$(curl --fail --silent --show-error \
              "https://gitee.com/api/v5/repos/mderp/smart-task-board/branches/$BRANCH" \
              | jq -r '.commit.sha // empty'); then
              if [ "$MIRROR_SHA" = "$TARGET_SHA" ]; then
                echo "Gitee $BRANCH synced to $TARGET_SHA"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Gitee sync timeout: expected $TARGET_SHA, got $MIRROR_SHA"
          exit 1

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            DIR="${{ steps.env.outputs.dir }}"
            BRANCH="${{ steps.env.outputs.branch }}"
            COMPOSE="${{ steps.env.outputs.compose }}"
            TARGET_SHA="${{ github.sha }}"
            WEB_PORT="${{ steps.env.outputs.web_port }}"
            BACKEND_PORT="${{ steps.env.outputs.backend_port }}"

            ARCHIVE=$(mktemp)
            SOURCE_DIR=$(mktemp -d)
            DEPLOY_LOG=$(mktemp)
            cleanup() {
              rm -f "$ARCHIVE" "$DEPLOY_LOG"
              rm -rf "$SOURCE_DIR"
            }
            trap cleanup EXIT

            mkdir -p "$DIR"
            # 用 Gitee 镜像下载 tarball（服务器无法访问 GitHub）
            curl --fail --silent --show-error --location \
              --output "$ARCHIVE" \
              "https://gitee.com/mderp/smart-task-board/repository/archive/$TARGET_SHA.tar.gz"
            tar -tzf "$ARCHIVE" >/dev/null
            tar -xzf "$ARCHIVE" --strip-components=1 -C "$SOURCE_DIR"

            if [ ! -f "$SOURCE_DIR/$COMPOSE" ]; then
              echo "Archive does not contain $COMPOSE"
              exit 1
            fi

            if [ "$BRANCH" = "main" ]; then
              for REQUIRED_CONFIG in "$DIR/backend/.env.prod" "$DIR/web/.env.prod"; do
                if [ ! -f "$REQUIRED_CONFIG" ]; then
                  echo "Production config $REQUIRED_CONFIG is missing"
                  exit 1
                fi
              done
            fi

            rsync -a --delete \
              --exclude='.env.prod' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='pgdata' \
              --exclude='.git' \
              "$SOURCE_DIR/" "$DIR/"
            cd "$DIR"

            if [ "$BRANCH" = "main" ]; then
              BACKEND_ENV_FILE="./backend/.env.prod"
              WEB_ENV_FILE="./web/.env.prod"
            else
              BACKEND_ENV_FILE="./backend/.env.test"
              WEB_ENV_FILE="./web/.env.test"
            fi
            for REQUIRED_CONFIG in "$BACKEND_ENV_FILE" "$WEB_ENV_FILE"; do
              if [ ! -f "$REQUIRED_CONFIG" ]; then
                echo "Config $REQUIRED_CONFIG is missing"
                exit 1
              fi
            done

            compose() {
              docker compose --env-file "$WEB_ENV_FILE" -f "$COMPOSE" "$@"
            }

            compose config --quiet

            if compose up -d --build >"$DEPLOY_LOG" 2>&1; then
              tail -50 "$DEPLOY_LOG"
            else
              tail -100 "$DEPLOY_LOG"
              exit 1
            fi

            EXPECTED_SERVICES=$(compose config --services | wc -l | tr -d ' ')
            RUNNING_SERVICES=0
            for attempt in $(seq 1 12); do
              RUNNING_SERVICES=$(compose ps --services --status running | wc -l | tr -d ' ')
              if [ "$RUNNING_SERVICES" -eq "$EXPECTED_SERVICES" ]; then
                break
              fi
              sleep 5
            done

            compose ps
            if [ "$RUNNING_SERVICES" -ne "$EXPECTED_SERVICES" ]; then
              compose logs --tail=100
              echo "Container health check failed: $RUNNING_SERVICES/$EXPECTED_SERVICES running"
              exit 1
            fi

            http_status_with_retry() {
              EXPECTED_STATUS="$1"
              URL="$2"
              HEADER="${3:-}"
              STATUS="000"
              for attempt in $(seq 1 12); do
                if [ -n "$HEADER" ]; then
                  STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    --max-time 10 --header "$HEADER" "$URL" || true)
                else
                  STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    --max-time 10 "$URL" || true)
                fi
                if [ "$STATUS" = "$EXPECTED_STATUS" ]; then
                  printf '%s' "$STATUS"
                  return 0
                fi
                sleep 5
              done
              printf '%s' "$STATUS"
              return 1
            }

            if ! WEB_STATUS=$(http_status_with_retry "200" "http://127.0.0.1:$WEB_PORT/login"); then
              echo "Web health check failed: expected=200 actual=$WEB_STATUS"
              compose logs --tail=100 web
              exit 1
            fi
            if ! BACKEND_STATUS=$(http_status_with_retry "200" "http://127.0.0.1:$BACKEND_PORT/health" "x-forwarded-proto: https"); then
              echo "Backend health check failed: expected=200 actual=$BACKEND_STATUS"
              compose logs --tail=100 backend
              exit 1
            fi
            echo "Deployment complete: commit=$TARGET_SHA web=$WEB_STATUS backend=$BACKEND_STATUS"
