name: Deploy · 智能任务板

# 自动化部署：
#   push 到 test 分支 → 部署到服务器【测试环境】（docker-compose.yml，端口 3000/3001）
#   push 到 main 分支 → 部署到服务器【生产环境】（docker-compose.prod.yml，端口 3100/3101）
#
# 前置条件（仓库 Settings → Secrets and variables → Actions）：
#   SERVER_HOST   服务器 IP，如 124.223.192.177
#   SERVER_USER   SSH 登录用户名
#   SSH_PRIVATE_KEY  登录服务器的私钥（对应服务器 ~/.ssh/authorized_keys 中的公钥）
#
# 服务器目录约定（需提前手动创建并 checkout 对应分支）：
#   测试：/opt/stb/test    （git checkout test）
#   生产：/opt/stb/prod    （git checkout main）
#
# 注意：backend/.env.prod 与 web/.env.prod 不进 git，需提前手动放到生产目录；
#       测试环境用已提交的 .env.test，无需额外配置。

on:
  push:
    branches: [main, test]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 解析目标环境
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/prod/prod" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
          else
            echo "name=test" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/test/test" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DIR=${{ steps.env.outputs.dir }}
            BRANCH=${{ steps.env.outputs.name }}
            COMPOSE=${{ steps.env.outputs.compose }}
            # 用 GitHub API 下载 tarball（无需镜像站、无需 SSH/HTTPS 认证）
            TMPDIR=$(mktemp -d)
            curl -sL "https://api.github.com/repos/kxilong/smart-task-board/tarball/$BRANCH" | tar xz --strip-components=1 -C "$TMPDIR"
            rsync -a --delete --exclude='.env.prod' --exclude='.env.test' --exclude='node_modules' --exclude='.next' --exclude='pgdata' --exclude='.git' "$TMPDIR/" "$DIR/"
            rm -rf "$TMPDIR"
            cd "$DIR"
            # 重新初始化 git（build 过程可能需要 git 版本信息）
            if [ ! -d .git ]; then
              git init && git remote add origin https://github.com/kxilong/smart-task-board.git
              git fetch origin $BRANCH --depth=1 && git reset --hard origin/$BRANCH
            fi
            docker compose -f $COMPOSE pull 2>/dev/null || true
            docker compose -f $COMPOSE up -d --build
            docker image prune -f
