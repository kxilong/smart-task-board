name: Deploy · 智能任务板

# 自动化部署：
#   push 到 test 分支 → 部署到服务器【测试环境】（docker-compose.yml，端口 3000/3001）
#   push 到 main 分支 → 部署到服务器【生产环境】（docker-compose.prod.yml，端口 3100/3101）
#
# 前置条件（仓库 Settings → Secrets and variables → Actions）：
#   SERVER_HOST   服务器 IP，如 124.223.192.177
#   SERVER_USER   SSH 登录用户名
#   SSH_PRIVATE_KEY  登录服务器的私钥（对应服务器 ~/.ssh/authorized_keys 中的公钥）
#
# Server deployment directories:
#   test: /opt/stb/test/test
#   production: /opt/stb/prod/prod
#
# 注意：backend/.env.prod 与 web/.env.prod 不进 git，需提前手动放到生产目录；
#       测试环境用已提交的 .env.test，无需额外配置。

on:
  push:
    branches: [main, test]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 解析目标环境
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/prod/prod" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
            echo "web_port=3100" >> "$GITHUB_OUTPUT"
            echo "backend_port=3101" >> "$GITHUB_OUTPUT"
          else
            echo "name=test" >> "$GITHUB_OUTPUT"
            echo "branch=test" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/test/test" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.yml" >> "$GITHUB_OUTPUT"
            echo "web_port=3000" >> "$GITHUB_OUTPUT"
            echo "backend_port=3001" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步代码到 Gitee（供服务器拉取）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.env.outputs.branch }}"
          TARGET_SHA="${{ github.sha }}"
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN is not configured"
            exit 1
          fi
          # 用 Gitee 镜像同步接口触发 pull from GitHub
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"access_token":"'"$GITEE_TOKEN"'"}' \
            --output /dev/null \
            "https://gitee.com/api/v5/repos/mderp/smart-task-board/mirror-sync"

          MIRROR_SHA=""
          for attempt in $(seq 1 12); do
            if MIRROR_SHA=$(curl --fail --silent --show-error \
              "https://gitee.com/api/v5/repos/mderp/smart-task-board/branches/$BRANCH" \
              | jq -r '.commit.sha // empty'); then
              if [ "$MIRROR_SHA" = "$TARGET_SHA" ]; then
                echo "Gitee $BRANCH synced to $TARGET_SHA"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Gitee sync timeout: expected $TARGET_SHA, got $MIRROR_SHA"
          exit 1

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            DIR="${{ steps.env.outputs.dir }}"
            BRANCH="${{ steps.env.outputs.branch }}"
            COMPOSE="${{ steps.env.outputs.compose }}"
            TARGET_SHA="${{ github.sha }}"
            WEB_PORT="${{ steps.env.outputs.web_port }}"
            BACKEND_PORT="${{ steps.env.outputs.backend_port }}"

            ARCHIVE=$(mktemp)
            SOURCE_DIR=$(mktemp -d)
            DEPLOY_LOG=$(mktemp)
            cleanup() {
              rm -f "$ARCHIVE" "$DEPLOY_LOG"
              rm -rf "$SOURCE_DIR"
            }
            trap cleanup EXIT

            mkdir -p "$DIR"
            # 用 Gitee 镜像下载 tarball（服务器无法访问 GitHub）
            curl --fail --silent --show-error --location \
              --output "$ARCHIVE" \
              "https://gitee.com/mderp/smart-task-board/repository/archive/$TARGET_SHA.tar.gz"
            tar -tzf "$ARCHIVE" >/dev/null
            tar -xzf "$ARCHIVE" --strip-components=1 -C "$SOURCE_DIR"

            if [ ! -f "$SOURCE_DIR/$COMPOSE" ]; then
              echo "Archive does not contain $COMPOSE"
              exit 1
            fi

            if [ "$BRANCH" = "main" ] && [ ! -f "$DIR/backend/.env.prod" ]; then
              echo "Production config backend/.env.prod is missing"
              exit 1
            fi

            rsync -a --delete \
              --exclude='.env.prod' \
              --exclude='.env.test' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='pgdata' \
              --exclude='.git' \
              "$SOURCE_DIR/" "$DIR/"
            cd "$DIR"
            docker compose -f "$COMPOSE" config --quiet

            if docker compose -f "$COMPOSE" up -d --build >"$DEPLOY_LOG" 2>&1; then
              tail -50 "$DEPLOY_LOG"
            else
              tail -100 "$DEPLOY_LOG"
              exit 1
            fi

            EXPECTED_SERVICES=$(docker compose -f "$COMPOSE" config --services | wc -l | tr -d ' ')
            RUNNING_SERVICES=0
            for attempt in $(seq 1 12); do
              RUNNING_SERVICES=$(docker compose -f "$COMPOSE" ps --services --status running | wc -l | tr -d ' ')
              if [ "$RUNNING_SERVICES" -eq "$EXPECTED_SERVICES" ]; then
                break
              fi
              sleep 5
            done

            docker compose -f "$COMPOSE" ps
            if [ "$RUNNING_SERVICES" -ne "$EXPECTED_SERVICES" ]; then
              docker compose -f "$COMPOSE" logs --tail=100
              echo "Container health check failed: $RUNNING_SERVICES/$EXPECTED_SERVICES running"
              exit 1
            fi

            WEB_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 10 "http://127.0.0.1:$WEB_PORT/login" || true)
            BACKEND_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 10 "http://127.0.0.1:$BACKEND_PORT/" || true)
            if [ "$WEB_STATUS" = "000" ] || [ "$BACKEND_STATUS" = "000" ]; then
              echo "HTTP health check failed: web=$WEB_STATUS backend=$BACKEND_STATUS"
              exit 1
            fi
            echo "Deployment complete: commit=$TARGET_SHA web=$WEB_STATUS backend=$BACKEND_STATUS"
