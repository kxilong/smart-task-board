name: Deploy · 智能任务板

# 自动化部署：
#   push 到 test 分支 → 部署到服务器【测试环境】（docker-compose.yml，端口 3000/3001）
#   push 到 main 分支 → 部署到服务器【生产环境】（docker-compose.prod.yml，端口 3100/3101）
#
# 前置条件（仓库 Settings → Secrets and variables → Actions）：
#   SERVER_HOST   服务器 IP，如 124.223.192.177
#   SERVER_USER   SSH 登录用户名
#   SSH_PRIVATE_KEY  登录服务器的私钥（对应服务器 ~/.ssh/authorized_keys 中的公钥）
#
# 服务器目录约定（需提前手动创建并 checkout 对应分支）：
#   测试：/opt/stb/test    （git checkout test）
#   生产：/opt/stb/prod    （git checkout main）
#
# 注意：backend/.env.prod 与 web/.env.prod 不进 git，需提前手动放到生产目录；
#       测试环境用已提交的 .env.test，无需额外配置。

on:
  push:
    branches: [main, test]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 解析目标环境
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/prod/prod" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
          else
            echo "name=test" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/stb/test/test" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步代码到 Gitee（供服务器拉取）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          BRANCH=${{ steps.env.outputs.name }}
          curl -X PUT "https://gitee.com/api/v5/repos/wanglin_5/smart-task-board" \
            -H "Content-Type: application/json" \
            -d '{"access_token":"'$GITEE_TOKEN'", "owner":"wanglin_5", "repo":"smart-task-board"}' \
            -s -o /dev/null || true
          # 用 Gitee 镜像同步接口触发 pull from GitHub
          curl -X POST "https://gitee.com/api/v5/repos/wanglin_5/smart-task-board/mirror-sync" \
            -H "Content-Type: application/json" \
            -d '{"access_token":"'$GITEE_TOKEN'"}' \
            -s -o /dev/null || true
          sleep 15  # 等待 Gitee 同步完成

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            DIR=${{ steps.env.outputs.dir }}
            BRANCH=${{ steps.env.outputs.name }}
            COMPOSE=${{ steps.env.outputs.compose }}
            # 用 Gitee 镜像下载 tarball（服务器无法访问 GitHub）
            TMPDIR=$(mktemp -d)
            curl -sL "https://gitee.com/wanglin_5/smart-task-board/repository/archive/$BRANCH.tar.gz" | tar xz --strip-components=1 -C "$TMPDIR"
            rsync -a --delete --exclude='.env.prod' --exclude='.env.test' --exclude='node_modules' --exclude='.next' --exclude='pgdata' --exclude='.git' "$TMPDIR/" "$DIR/"
            rm -rf "$TMPDIR"
            cd "$DIR"
            if [ ! -d .git ]; then
              git init -q
              git config --local user.email "deploy@localhost"
              git config --local user.name "deploy"
              git add -A && git commit -q -m "deploy $BRANCH $(date +%Y%m%d%H%M%S)" --allow-empty
            fi
            docker compose -f $COMPOSE pull 2>/dev/null || true
            docker compose -f $COMPOSE up -d --build 2>&1 | tail -50
            docker image prune -f
