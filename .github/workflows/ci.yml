name: CI · 智能任务板（阶段一）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
      - run: npm test            # 单元测试（不依赖数据库）
      # 端到端可选：需要可用的 Postgres
      # - run: npx prisma migrate deploy && npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test            # 组件测试 + 工具测试
      - run: npm run build
