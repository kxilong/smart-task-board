# 测试环境（test 分支）
# 启动：docker compose --env-file web/.env.test up -d --build
# 后端 http://localhost:3001 | 前端 http://localhost:3000
# 数据库 smart_task_board_test，与生产的 smart_task_board 完全隔离。
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_task_board_test
    ports:
      - '5432:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.test
    environment:
      NODE_ENV: development
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'

  web:
    env_file: ./web/.env.test
    build:
      context: ./web
      args:
        NEXT_PUBLIC_APP_ENV: test
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://124.223.192.177:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  pgdata_test:
